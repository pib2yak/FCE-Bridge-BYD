name: Build helper
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build
        run: >
          gradle --no-daemon assembleDebug
          -PhelperId=com.fce.onlinemedia.tidal
          -PplayerId=com.aspiro.tidal
          "-Plabel=Auxio (car link)"

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk Auxio-car-link.apk

      - name: Publish release (always the same one)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: helper
          name: Auxio car link helper
          body: |
            Lets BYD's media app use Auxio for BYD (`com.aspiro.tidal`) as a car media source.
            Package: `com.fce.onlinemedia.tidal`. Hidden from the app launcher.

            Install: `adb install -r Auxio-car-link.apk`
          files: Auxio-car-link.apk
          make_latest: true
